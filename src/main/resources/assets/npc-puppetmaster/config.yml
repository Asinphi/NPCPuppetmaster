# Whether Easy NPCs are controllable puppets by default (meaning players with permissions can control them)
# Either way, you can make an exception via /editpuppet <npcEntity> ispuppet <true|false>
npcs_are_puppets_by_default: true

# EasyNPC presets (in config/easy_npc) players can use with the /spawnpuppet command
puppet_presets:
  guard:
    path: "preset/humanoid_slim/guard.npc.nbt"

# Default options applied to puppets spawned with /spawnpuppet; override any of these in the presets above
default_preset_options:
  is_puppet: true
  # Whether they should be removed when the chunks are unloaded
  transient: true

# Rate limit /spawnpuppet (per player)
create_puppet_rate_limit:
  # Set to -1 to disable rate limiting
  max_puppets: 4
  interval_seconds: 1800

# List of commands that will be executed by console when a player possesses an NPC puppet
possession_commands:
  - "character temp name {npc} {player}"
  - "character temp desc Currently controlling an NPC. {player}"

unpossession_commands:
  - "character temp clear {player}"

# Whether to enable debug logging
enable_debug: false

# Do not change this value unless you know what you are doing!
config_version: 1