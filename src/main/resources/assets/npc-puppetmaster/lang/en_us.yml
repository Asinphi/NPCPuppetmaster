commands:
  help: |-
    <#4e46c2><strikethrough>                          </strikethrough></#4e46c2> <#ad60e0>Commands</#ad60e0> <#4e46c2><strikethrough>                          </strikethrough></#4e46c2>
    <gray><italic>    Hover a command for extra info, click to run.</italic></gray>

    <click:run_command:'/puppeteer'><hover:show_text:'<white>/puppeteer</white><newline><newline><gray>Open the puppeteer selector UI. You can also press <yellow>V</yellow> (rebind in Controls > Key Binds).</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcp.puppeteer.use</gray>'><#ad60e0>  /puppeteer</#ad60e0> <gray>-</gray> <white>Open the puppeteer UI.</white></hover></click>
    <click:suggest_command:'/spawnpuppet '><hover:show_text:'<white>/spawnpuppet <gold><preset></gold> <#ad60e0>[here|there]</#ad60e0></white><newline><newline><gray>Spawn a puppet NPC from one of the presets defined in the config file.</gray><newline><newline><gray>You can specify whether to spawn the puppet <#ad60e0>here</#ad60e0> (where you\'re standing) or <#ad60e0>there</#ad60e0> (where you\'re looking).<newline><newline><dark_gray>Permission:</dark_gray> <gray>npcp.spawnpuppet</gray>'><#ad60e0>  /spawnpuppet</#ad60e0> <gray>-</gray> <white>Spawn a puppet NPC.</white></hover></click>
    <click:suggest_command:'/editpuppet '><hover:show_text:'<white>/editpuppet <gold><npc></gold> <#ad60e0>...</#ad60e0></white><newline><newline><gray>Edit puppet NPC settings and permissions.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcp.edit</gray>'><#ad60e0>  /editpuppet</#ad60e0> <gray>-</gray> <white>Edit puppet NPC settings.</white></hover></click>
    <click:run_command:'/familiar help'><hover:show_text:'<white>/familiar <#ad60e0>[subcommand]</#ad60e0></white><newline><newline><gray>Create, spawn, and manage your familiars.</gray><newline><newline><gray>Familiars are personal puppets you can customize with your own Figura avatars.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcp.familiar.use</gray>'><#ad60e0>  /familiar</#ad60e0> <gray>-</gray> <white>Manage familiars.</white></hover></click>
    <click:run_command:'/npcp reload'><hover:show_text:'<white>/npcp reload</white><newline><newline><gray>Reload configuration and language files.</gray><newline><newline><dark_gray>Permission:</dark_gray> <gray>npcp.reload</gray>'><#ad60e0>  /npcp reload</#ad60e0> <gray>-</gray> <white>Reload the mod.</white></hover></click>

  common:
    no_entity_in_sight: "<prefixes.error>No entity in sight."
    no_targets_matched: "<prefixes.error>No targets matched."

  editpuppet:
    transient:
      enabled: "<prefixes.success>NPC <yellow><target></yellow> will now <yellow>despawn</yellow> when chunks unload."
      disabled: "<prefixes.success>NPC <yellow><target></yellow> will now <green>never despawn</green> when chunks unload."
    ispuppet:
      enabled: "<prefixes.success>NPC <yellow><target></yellow> now has its puppet controls <green>enabled</green>."
      disabled: "<prefixes.success>NPC <yellow><target></yellow> now has its puppet controls <red>disabled</red>."
    owneronly:
      enabled: "<prefixes.success>NPC <yellow><target></yellow> can now be controlled <red>exclusively by its owner</red>."
      disabled: "<prefixes.success>NPC <yellow><target></yellow> can now be controlled <yellow>by anyone</yellow>."
    permission:
      cleared: "<prefixes.success>NPC <yellow><target></yellow> no longer requires a special permission to control."
      success: "<prefixes.success>NPC <yellow><target></yellow> now requires permission <yellow><permission></yellow> to be controlled."

  spawnpuppet:
    success: "<prefixes.success>Puppet NPC <yellow><preset></yellow> has been spawned."
    rate_limited: "<prefixes.error>You have reached your puppet creation limit. You can create up to <yellow><max_count></yellow> puppets every <yellow><window></yellow>. Please wait <yellow><wait_time></yellow> before creating another puppet."
    failure: "<prefixes.error>An error occurred while trying to spawn puppet NPC <gray><preset></gray>."
    invalid_preset: "<prefixes.error>Invalid puppet preset '<gray><preset></gray>'. Click a valid preset: <yellow><valid_presets></yellow>."
    presets_list: "<prefixes.info>Click a puppet preset: <yellow><presets></yellow>."

  familiar:
    help: |-
      <#4e46c2><strikethrough>                          </strikethrough></#4e46c2> <#ad60e0>Familiars</#ad60e0> <#4e46c2><strikethrough>                          </strikethrough></#4e46c2>
      <gray><italic>    Hover a command for extra info, click to run.</italic></gray>

      <click:suggest_command:'/familiar create '><hover:show_text:'<white>/familiar create <gold><id></gold> <#ad60e0>[displayName]</#ad60e0></white><newline><newline><gray>Create a new familiar using the base template. Your current Figura avatar will automatically be applied to them.</gray>'><#ad60e0>  /familiar create</#ad60e0> <gray>-</gray> <white>Create a new familiar.</white></hover></click>
      <click:run_command:'/familiar list'><hover:show_text:'<white>/familiar list</white><newline><newline><gray>List your saved familiars.</gray>'><#ad60e0>  /familiar list</#ad60e0> <gray>-</gray> <white>List your saved familiars.</white></hover></click>
      <click:suggest_command:'/familiar spawn '><hover:show_text:'<white>/familiar spawn <#ad60e0>[id]</#ad60e0></white><newline><newline><gray>Spawn one of your familiars. You cannot spawn multiple copies of the same familiar.</gray>'><#ad60e0>  /familiar spawn</#ad60e0> <gray>-</gray> <white>Spawn a familiar.</white></hover></click>
      <click:suggest_command:'/familiar erase '><hover:show_text:'<white>/familiar erase <gold><id></gold></white><newline><newline><gray>Permanently delete a familiar. If you just want to despawn it, use the delete button in the puppeteer GUI.</gray>'><#ad60e0>  /familiar erase</#ad60e0> <gray>-</gray> <white>Permanently delete a familiar.</white></hover></click>
      <click:suggest_command:'/familiar edit name '><hover:show_text:'<white>/familiar edit name <gold><value></gold> <#ad60e0>[id]</#ad60e0></white><newline><newline><gray>Change a familiar\'s display name.</gray>'><#ad60e0>  /familiar edit name</#ad60e0> <gray>-</gray> <white>Rename a familiar.</white></hover></click>
      <click:suggest_command:'/familiar edit autospawn '><hover:show_text:'<white>/familiar edit autospawn <gold><true|false></gold> <#ad60e0>[id]</#ad60e0></white><newline><newline><gray>Choose whether the familiar automatically spawns nearby when you log in.</gray>'><#ad60e0>  /familiar edit autospawn</#ad60e0> <gray>-</gray> <white>Toggle autospawn.</white></hover></click>
      <click:suggest_command:'/familiar edit avatar'><hover:show_text:'<white>/familiar edit avatar <#ad60e0>[id]</#ad60e0></white><newline><newline><gray>Use your current avatar on a familiar.</gray>'><#ad60e0>  /familiar edit avatar</#ad60e0> <gray>-</gray> <white>Apply your current avatar.</white></hover></click>

    create_success: "<prefixes.success>Familiar <yellow><id></yellow> created as <white><name></white>."
    create_exists: "<prefixes.error>You already have a familiar named <yellow><id></yellow>."
    create_failed: "<prefixes.error>Failed to create familiar <yellow><id></yellow>."
    create_max_total: "<prefixes.error>You have reached the maximum number of familiars (<yellow><max></yellow>)."
    list_empty: "<prefixes.info>You don't have any saved familiars yet."
    list: "<prefixes.info>Your familiars:<newline><entries>"
    missing: "<prefixes.error>No familiar found with id <yellow><id></yellow>."
    erase_confirm: "<prefixes.warn>This will permanently delete <yellow><id></yellow>. If you just want to remove the entity, use the puppeteer control GUI.<newline><prefixes.question>Click to confirm: <command>."
    erase_success: "<prefixes.success>Familiar <yellow><id></yellow> has been permanently deleted."
    none_saved: "<prefixes.error>You don't have any saved familiars."
    none_spawned: "<prefixes.error>You don't have any familiars spawned in."
    spawn_choose: "<prefixes.info>Click a familiar to spawn: <yellow><options></yellow>."
    spawn_already: "<prefixes.info>Familiar <yellow><id></yellow> is already spawned."
    spawn_failed: "<prefixes.error>Failed to spawn familiar <yellow><id></yellow>."
    spawn_success: "<prefixes.success>Familiar <yellow><id></yellow> spawned as <white><name></white>."
    not_spawned: "<prefixes.error>Familiar <yellow><id></yellow> isn't currently spawned."
    edit_choose: "<prefixes.info>Click a familiar to edit: <yellow><options></yellow>."
    edit_name_success: "<prefixes.success>Familiar <yellow><id></yellow> renamed to <white><name></white>."
    edit_avatar_success: "<prefixes.success>Familiar <yellow><id></yellow> now uses your current avatar."
    autospawn_enabled: "<prefixes.success>Familiar <yellow><id></yellow> will now autospawn."
    autospawn_disabled: "<prefixes.success>Familiar <yellow><id></yellow> will no longer autospawn."

  reload:
    completed: "<prefixes.success>Reload complete."

delete:
  success: "<prefixes.success>Puppet NPC <yellow><target></yellow> has been deleted."

possess:
  success: "<prefixes.success>You are now possessing NPC <yellow><target></yellow>. Use <yellow>/unpossess</yellow> to stop possessing."
  no_avatar_override: "<prefixes.error>This NPC is not able to be possessed."
  end: "<prefixes.success>You have stopped possessing NPC <yellow><target></yellow>."
  forced_end: "<prefixes.warn>Your control of <yellow><target></yellow> has been forcefully interrupted."
  not_possessing: "<prefixes.error>You are not currently possessing any NPC."

not_a_puppet: "<prefixes.error>Target entity is not a controllable puppet NPC."
owner_only: "<prefixes.error>This NPC can be controlled exclusively by its owner."
no_permission: "<prefixes.error>You do not have permission to perform this operation."
require_permission: "<prefixes.error>You require permission <yellow><permission></yellow> to perform this operation."

global_placeholders:
  # Brand prefix (optional; not automatically included in status prefixes unless you add it)
  prefix: "<gray>[<gradient:#9339bd:#4e46c2>NPC Puppetmaster</gradient>]</gray> "

  prefixes:
    info: "<dark_gray>[<blue><bold>i</bold></blue><dark_gray>]</dark_gray> <gray>"
    success: "<dark_gray>[<dark_green><bold>✔</bold></dark_green><dark_gray>]</dark_gray> <gray>"
    warn: "<dark_gray>[<gold><bold>!</bold></gold><dark_gray>]</dark_gray> <gold>"
    error: "<dark_gray>[<dark_red><bold>X</bold></dark_red><dark_gray>]</dark_gray> <red>"
    question: "<dark_gray>[<green><bold>?</bold></green><dark_gray>]</dark_gray> <gray>"
    announce: "<dark_gray>[<dark_purple><bold>!</bold></dark_purple><dark_gray>]</dark_gray> <light_purple>"

  symbols:
    right_arrow: "→"
    bullet: "•"
